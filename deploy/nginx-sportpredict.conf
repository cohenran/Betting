server {
    listen 80;
    listen [::]:80;
    server_name _;

    access_log /var/log/nginx/sportpredict.access.log;
    error_log  /var/log/nginx/sportpredict.error.log;

    # The admin endpoints trigger ingest and retraining. Restrict them at the edge as
    # well as by token - uncomment and set your own address range.
    location /api/admin/ {
        # allow 203.0.113.0/24;
        # deny all;
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 900s;
    }

    # Backtests and scraping runs are slow by nature; do not let nginx cut them off.
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 900s;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/proxy_params;
    }
}

# For HTTPS: install certbot and run
#   certbot --nginx -d your-domain
# It rewrites this file with the TLS listener and a redirect.
