spring:
  application:
    name: sportpredict
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sportpredict}
    username: ${DB_USER:sportpredict}
    password: ${DB_PASSWORD:sportpredict}
    hikari:
      maximum-pool-size: 12
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        order_inserts: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8090}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    il.co.sportpredict: INFO

sportpredict:
  # Admin endpoints (/api/admin/**) require this token in the X-Admin-Token header.
  admin-token: ${ADMIN_TOKEN:change-me}

  providers:
    api-sports:
      enabled: ${APISPORTS_ENABLED:true}
      key: ${APISPORTS_KEY:}
      # Free tier is 10 req/min, 100 req/day. Raise once you upgrade.
      requests-per-minute: ${APISPORTS_RPM:10}
      daily-limit: ${APISPORTS_DAILY:100}
      football-base-url: https://v3.football.api-sports.io
      basketball-base-url: https://v1.basketball.api-sports.io
      mma-base-url: https://v1.mma.api-sports.io
    allsports:
      enabled: ${ALLSPORTS_ENABLED:true}
      key: ${ALLSPORTS_KEY:}
      requests-per-minute: ${ALLSPORTS_RPM:30}
      daily-limit: ${ALLSPORTS_DAILY:1000}
      base-url: https://apiv2.allsportsapi.com

  ingest:
    # api-sports league ids. 383 = Ligat ha'Al (Israel), 384 = Liga Leumit (Israel).
    # 39 EPL, 140 La Liga, 135 Serie A, 78 Bundesliga, 61 Ligue 1, 2 UCL, 3 Europa League.
    football-leagues: [383, 384, 39, 140, 135, 78, 61, 2, 3]
    # allsportsapi league ids, all confirmed against met=Leagues.
    # Israel: 202 Ligat Al, 201 Liga Leumit, 203 Toto Cup, 358 State Cup, 573 Super Cup.
    #   Liga Alef (610) is deliberately excluded - third tier, thin data, and it drags the
    #   attack/defence scale around for the clubs that meet it in cup rounds.
    # Europe: 152 EPL, 302 La Liga, 207 Serie A, 175 Bundesliga,
    #         3 UCL, 4 Europa League, 683 Conference League.
    allsports-football-leagues: [202, 201, 203, 358, 573, 152, 302, 207, 175, 3, 4, 683]
    basketball-leagues: [12, 117, 120]
    # Empty = every basketball league allsports carries (~1400 records per 10-day chunk).
    # Fill this in from met=Leagues on their basketball endpoint.
    allsports-basketball-leagues: []
    seasons: [2024, 2025, 2026]
    history-days: 730
    # Fallback horizon when lookahead-by-provider is empty.
    lookahead-days: 14
    # every 4 hours: pull fixtures from yesterday..+lookahead (results + new draws)
    recent-cron: "0 30 */4 * * *"
    # hourly deep backfill of history, one chunk per run
    history-cron: "0 0 * * * *"
    chunk-days: 10
    # api-sports costs 1 request per day of range, so keep its horizon short.
    # allsports takes the whole range in one request - it carries the betting horizon.
    lookahead-by-provider:
      api-sports: 3
      allsports: 14
    # api-sports free tier is 100 requests/day. Budget, with recent-cron every 4 hours:
    #   recent  MMA only, 6-day window = 6 req x 6 runs/day = 36
    #   history MMA only, 10-day chunk = 11 req  -> ~5 chunks/day within the remaining 64
    # That backfills ~50 days of MMA per day: 730 days in roughly two weeks.
    # Letting api-sports also serve football/basketball on the recent run costs 72 req/day
    # duplicating what allsports gives away, and starves MMA completely.
    recent-providers:
      FOOTBALL: [allsports]
      BASKETBALL: [allsports]
      MMA: [api-sports]
    # History routing. Football/basketball go to allsports (1 request per 10-day chunk),
    # leaving the metered api-sports quota for MMA, which has no alternative source.
    history-providers:
      FOOTBALL: [allsports]
      BASKETBALL: [allsports]
      MMA: [api-sports]

  model:
    retrain-cron: "0 0 4 * * *"
    min-matches-for-fit: 120
    # Walk-forward evaluation after each nightly refit, stored for the paper-bet gate.
    backtest-after-retrain: true
    backtest-history-days: 540
    backtest-step-days: 7
    backtest-train-fraction: 0.6
    football:
      half-life-days: 240
      iterations: 500
      learning-rate: 0.015
      l2: 0.02
      max-goals: 10
      rho-min: -0.20
      rho-max: 0.10
      rho-steps: 31
      ou-line: 2.5
    elo:
      k-football: 20.0
      k-basketball: 20.0
      k-ufc: 24.0
      home-advantage: 65.0
      initial: 1500.0
    basketball:
      half-life-days: 180
      margin-sd: 11.5
      elo-per-point: 28.0
      home-advantage-points: 2.8
    ufc:
      learning-rate: 0.03
      l2: 0.001
      epochs-on-refit: 8

  winner:
    enabled: true
    playwright-enabled: ${PLAYWRIGHT_ENABLED:true}
    timeout-seconds: 45
    user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/137.0.0.0 Safari/537.36"
    # Candidate internal JSON endpoints tried before falling back to a browser.
    # Winner changes these; add whatever you see in DevTools -> Network.
    json-endpoints:
      - "https://www.winner.co.il/api/games"
      - "https://www.winner.co.il/api/v2/games"
      - "https://www.winner.co.il/api/betting/programs"
    # Fuzzy-match threshold when binding a Winner line to a stored fixture.
    match-threshold: 0.86
    kickoff-tolerance-hours: 30

  paper-betting:
    enabled: true
    winner-url: "https://www.winner.co.il/mainbook/sport"
    cron: "0 0 8 * * *"
    starting-bankroll: 1000.0
    data-dir: ${PAPER_DIR:/opt/sportpredict/paper}
    # ALLSPORTS: market prices from met=Odds, joined to fixtures by the provider's own
    # match id. Runs unattended and costs one request per window.
    # WINNER: scrape a betting form - needs a page that is not behind bot protection.
    odds-source: ALLSPORTS
    odds-window-days: 3
    # Flat is the arm that answers "is there an edge". Kelly arms answer a different
    # question and only become meaningful once calibration is known.
    flat-stake: 10.0
    # Do not bet until the Dixon-Coles fit has this many matches behind it.
    min-fit-sample: 300
    # Also require the stored backtest to beat the baseline log-loss before betting.
    require-backtest-edge: true
    sports: [FOOTBALL]
    min-edge: 0.02
